# ==========================================
# Primary Source
# 一次情報源
# ==========================================

primary_source:
  publisher:
    name:
      ja: "文部科学省"
      en: "Ministry of Education, Culture, Sports, Science and Technology"
    abbreviation: "MEXT"

  title:
    ja: "文部科学省 学校コード"
    en: "MEXT School Codes"

  official_page: "https://www.mext.go.jp/b_menu/toukei/mext_01087.html"

  language:
    - "ja"


# ==========================================
# Current Release
# 現行版
# ==========================================

current_release:
  reference_date: "2026-05-01"
  source_updated_at: "2026-05-20"
  published_at: "2026-05-29"

  edition:
    ja: "暫定版"
    en: "provisional"

  source_groups:
    - id: "general-schools-east"
      scope:
        ja: "幼稚園等から各種学校まで・東日本"
        en: "General school categories, eastern Japan"
      format: "csv"

    - id: "higher-education"
      scope:
        ja: "大学・短期大学・高等専門学校"
        en: "Universities, junior colleges, and colleges of technology"
      geographic_scope: "nationwide"
      format: "csv"

    - id: "general-schools-west"
      scope:
        ja: "幼稚園等から各種学校まで・西日本"
        en: "General school categories, western Japan"
      format: "csv"


# ==========================================
# Source Format
# 一次データ形式
# ==========================================

source_format:
  file_format: "csv"
  encoding: "cp932"
  title_row: 1
  header_row: 2
  data_start_row: 3

  original_columns:
    - "学校コード"
    - "学校種"
    - "都道府県番号"
    - "設置\n区分"
    - "本分校"
    - "学校名"
    - "学校所在地"
    - "郵便番号"
    - "属性情報\n設定年月日"
    - "属性情報\n廃止年月日"
    - "旧学校\n調査番号"
    - "移行後の学校コード"


# ==========================================
# Terms of Use
# 利用条件
# ==========================================

terms_of_use:
  source_terms:
    title:
      ja: "文部科学省ウェブサイト利用規約"
      en: "MEXT Website Terms of Use"
    url: "https://www.mext.go.jp/b_menu/1351168.htm"

  public_data_license:
    name:
      ja: "公共データ利用規約（第1.0版）"
      en: "Public Data License Version 1.0"

  compatible_with:
    - "CC BY 4.0"

  notes:
    ja: >
      文部科学省ウェブサイト利用規約に従い、出典を明示する。
      編集・加工等を行った場合は、その旨を明示する。
    en: >
      Source attribution is required in accordance with the MEXT Website
      Terms of Use. Any editing or modification must also be disclosed.


# ==========================================
# Processing
# 処理方針
# ==========================================

processing:
  source_of_record: "MEXT published CSV files"

  principles:
    - "preserve-primary-source"
    - "record-provenance"
    - "separate-primary-and-secondary-data"
    - "document-transformations"
    - "reproducible-processing"
    - "difference-detection"
    - "human-review-when-needed"

  normalization:
    column_name_line_breaks: "remove"
    split_school_type_code_and_label: true
    split_prefecture_code_and_label: true
    split_founder_code_and_label: true
    split_school_status_code_and_label: true
    preserve_source_labels: true

    preserve_leading_zeros:
      - "school_code"
      - "prefecture_code"
      - "postal_code"
      - "obsolete_school_survey_number"
      - "successor_school_code"

  planned_outputs:
    - format: "yaml"
      role: "secondary-data-master"

    - format: "json"
      role: "machine-readable-distribution"

    - format: "csv"
      role: "tabular-distribution"


# ==========================================
# Update Policy
# 更新方針
# ==========================================

update_policy:
  source_monitoring: "planned"
  automation: "planned"
  automation_platform: "GitHub Actions"
  human_review: true

  regeneration_policy:
    ja: >
      二次データは差分更新せず、一次情報源から全件を再生成する。
      差分は更新判定および生成結果の検証に使用する。
    en: >
      Secondary data is regenerated in full from the primary source
      rather than incrementally updated. Differences are used to detect
      source updates and to validate generated results.

  vocabulary_validation:
    source_and_metadata: "pass"
    source_only: "error"
    metadata_only: "warning"

  workflow:
    - "check-source-update"
    - "retrieve-source-files"
    - "compare-source-files"
    - "generate-secondary-data"
    - "validate-controlled-vocabularies"
    - "validate-structure"
    - "validate-cross-format-consistency"
    - "compare-with-previous-version"
    - "generate-difference-report"
    - "human-review"
    - "merge"


# ==========================================
# Provenance
# 来歴
# ==========================================

provenance:
  source_preservation: true
  source_directory: "sources/"
  data_directory: "data/"
  scripts_directory: "scripts/"
  reports_directory: "reports/"


# ==========================================
# Documentation
# ドキュメント
# ==========================================

documentation:
  readme: "README.md"
  repository_root_readme: "../../README.md"


# ==========================================
# Maintenance
# 管理
# ==========================================

maintenance:
  project: "open-secondary-data"
  repository: "kojikomatsuzaki/open-secondary-data"

  contact_policy:
    ja: "管理者・問い合わせ先はルートREADMEを参照"
    en: "See the root README for maintainer and contact information."
    