schema_version: "1.0"


# ==========================================
# Dataset
# データセット
# ==========================================

dataset:
  id: "mext-school-codes"
  title:
    ja: "文部科学省 学校コード"
    en: "MEXT School Codes"
  description:
    ja: >
      文部科学省が公開する「学校コード」を一次情報源として、
      再利用しやすい形式へ整理・構造化した二次データセット。
    en: >
      A secondary dataset derived from the official School Codes
      published by Japan's Ministry of Education, Culture, Sports,
      Science and Technology (MEXT), organized and structured for reuse.
  domain: "school-codes-jp"
  status: "active"


# ==========================================
# Field Definitions
# フィールド定義
# ==========================================

field_definitions:
  source_label:
    ja: >
      一次情報源に記載されている区分値の表記を、加工せずに保持したもの。
      一次情報源との照合および来歴の確認に使用する。
    en: >
      The classification label as represented in the primary source,
      preserved without normalization for source comparison and provenance.

  source_labels:
    ja: >
      同一の正規化された区分値に対して、一次情報源に複数の表記が存在する場合に、
      それらの表記を保持するためのリスト。
    en: >
      A list of source labels used when multiple representations in the
      primary source correspond to the same normalized classification value.

  normalized_name:
    ja: >
      一次情報源の表記をもとに、二次データとして利用しやすいよう正規化した名称。
      一次情報源の表記そのものは source_label または source_labels に保持する。
    en: >
      A normalized name provided for convenient reuse as secondary data.
      The original representation from the primary source is preserved
      separately in source_label or source_labels.


# ==========================================
# Identifier Format
# 識別子形式
# ==========================================

identifier_format:
  school_code:
    pattern: "^[A-Z][0-9]{12}$"
    description:
      ja: >
        学校コードは、学校種を示す英字1文字と数字12桁から構成される。
    en: >
        A school code consists of one uppercase alphabetic character
        followed by twelve digits.


# ==========================================
# Coverage and Controlled Vocabularies
# 対象範囲・統制語彙
# ==========================================

