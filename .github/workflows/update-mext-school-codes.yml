name: Update MEXT School Codes


# ==========================================
# Permissions
# 権限
# ==========================================

permissions:
  contents: write
  pull-requests: write


# ==========================================
# Trigger
# 実行条件
# ==========================================

on:
  workflow_dispatch:


# ==========================================
# Jobs
# ジョブ
# ==========================================

jobs:
  update-dataset:
    name: Check, normalize, validate, compare, and create PR
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # ------------------------------------------
      # Checkout
      # リポジトリ取得
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------
      # Python
      # Python実行環境
      # ------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # ------------------------------------------
      # Dependencies
      # 依存ライブラリ
      # ------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r school-codes-jp/mext-school-codes/scripts/requirements.txt

      # ------------------------------------------
      # Fetch and change detection
      # 一次情報源取得・更新判定
      # ------------------------------------------

      - name: Check MEXT source files
        id: fetch
        run: |
          python school-codes-jp/mext-school-codes/scripts/fetch_sources.py

      # ------------------------------------------
      # Show change detection result
      # 更新判定結果表示
      # ------------------------------------------

      - name: Show source update status
        run: |
          echo "changed=${{ steps.fetch.outputs.changed }}"
          echo "added_count=${{ steps.fetch.outputs.added_count }}"
          echo "removed_count=${{ steps.fetch.outputs.removed_count }}"
          echo "modified_count=${{ steps.fetch.outputs.modified_count }}"

      # ------------------------------------------
      # Normalize
      # 二次データ生成
      # ------------------------------------------

      - name: Normalize school codes
        if: steps.fetch.outputs.changed == 'true'
        run: |
          python school-codes-jp/mext-school-codes/scripts/normalize.py

      # ------------------------------------------
      # Validate
      # 検証
      # ------------------------------------------

      - name: Validate generated data
        if: steps.fetch.outputs.changed == 'true'
        run: |
          python school-codes-jp/mext-school-codes/scripts/validate.py

      # ------------------------------------------
      # Compare
      # 前回版との差分比較
      # ------------------------------------------

      - name: Compare with previous version
        if: steps.fetch.outputs.changed == 'true'
        run: |
          python school-codes-jp/mext-school-codes/scripts/compare.py

      # ------------------------------------------
      # Show Git differences
      # Git差分確認
      # ------------------------------------------

      - name: Show repository changes
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git status --short
          git diff --stat

      # ------------------------------------------
      # Create Pull Request
      # Pull Request作成
      # ------------------------------------------

      - name: Create update pull request
        if: steps.fetch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          branch: automation/mext-school-codes-update
          delete-branch: true

          commit-message: "Update MEXT school codes dataset"

          title: "Update MEXT school codes dataset"

          body-path: school-codes-jp/mext-school-codes/reports/latest-changes.md

          labels: |
            automated
            data-update

      # ------------------------------------------
      # No change
      # 更新なし
      # ------------------------------------------

      - name: No source changes detected
        if: steps.fetch.outputs.changed != 'true'
        run: |
          echo "MEXT source files are already up to date."
          echo "Normalization, validation, comparison, and PR creation were skipped."
          